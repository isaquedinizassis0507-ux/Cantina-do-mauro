<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantina do Mauro | Cardápio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap');
:root{--wine:#651b22;--wine-dark:#421116;--gold:#d6a243;--cream:#fbf7f0;--ink:#2c2320;--muted:#776b63;--card:#fff;--line:#eadfd2}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',Arial,sans-serif}header{background:linear-gradient(120deg,#3d0e14,#7b242b);color:#fff;padding:28px 6%;position:relative;overflow:hidden}header:after{content:'✦';position:absolute;right:8%;top:-28px;font-size:180px;color:#ffffff12;transform:rotate(20deg)}.top{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}.marca{display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:29px}.eyebrow{color:#efcc83;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;font-weight:bold}.marca h1{font:700 2rem 'Playfair Display',serif;margin:2px 0}.slogan{color:#f9e9c7;margin:0}.badge{background:#ffffff18;border:1px solid #ffffff30;padding:10px 15px;border-radius:20px;font-size:.85rem}main{max-width:1180px;margin:30px auto;padding:0 20px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.intro h2{font:700 2rem 'Playfair Display',serif;margin:0}.intro p{color:var(--muted);margin:7px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px}.produto{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 20px #4b28120d;transition:.2s}.produto:hover{transform:translateY(-3px);box-shadow:0 10px 25px #4b28121a}.foto{height:145px;background:#eee center/cover no-repeat;position:relative}.tag{position:absolute;top:11px;left:11px;background:#fff;color:var(--wine);padding:5px 9px;border-radius:20px;font-size:.7rem;font-weight:bold}.info{padding:15px}.info h3{font-size:1.02rem;margin:0 0 6px}.descricao{font-size:.8rem;color:var(--muted);min-height:32px;margin:0 0 12px}.rodape-card{display:flex;justify-content:space-between;align-items:center}.preco{font-weight:bold;color:var(--wine);font-size:1.1rem}.controle{display:flex;align-items:center;gap:9px}.controle button{border:0;width:31px;height:31px;border-radius:50%;background:var(--wine);color:#fff;font-size:1.1rem;cursor:pointer}.qtd{font-weight:bold;min-width:18px;text-align:center}.resumo{margin:28px 0;background:var(--wine-dark);color:#fff;border-radius:18px;padding:22px 25px;box-shadow:0 9px 25px #4b12152b}.resumo h2{margin:0 0 12px;font:700 1.35rem 'Playfair Display',serif}.lista{margin:0;padding-left:20px;color:#f9e9c7;line-height:1.8}.vazio{color:#d7bbb0;list-style:none;margin-left:-20px}.total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff30;margin-top:15px;padding-top:15px;font-size:1.35rem;font-weight:bold}.acoes{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.acao{border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:bold;background:var(--gold);color:#351c08}.limpar{background:#ffffff18;color:#fff;border:1px solid #ffffff40}footer{text-align:center;color:var(--muted);font-size:.8rem;padding:8px 20px 30px}@media(max-width:600px){.top,.intro{align-items:flex-start;flex-direction:column}.badge{align-self:flex-start}.marca h1{font-size:1.7rem}}
@media print{header{background:var(--wine);-webkit-print-color-adjust:exact;print-color-adjust:exact}.grid,.acoes{display:none}.resumo{box-shadow:none}}
</style></head>
<body>
<header><div class="top"><div class="marca"><div class="logo">🍽</div><div><div class="eyebrow">Cardápio oficial</div><h1>Cantina do Mauro</h1><p class="slogan">Sabor caseiro que dá gosto.</p></div></div><div class="badge">● Atendimento rápido</div></div></header>
<main><div class="intro"><div><h2>Monte seu pedido</h2><p>Escolha os itens e ajuste as quantidades.</p></div></div><section class="grid" id="produtos"></section><section class="resumo"><h2>Resumo do pedido</h2><ul class="lista" id="lista"><li class="vazio">Seu pedido está vazio.</li></ul><div class="total"><span>Total do pedido</span><span id="total">R$ 0,00</span></div><div class="acoes"><button class="acao limpar" onclick="limpar()">Limpar pedido</button><button class="acao" onclick="window.print()">Imprimir pedido</button></div></section></main><footer>Cantina do Mauro • Feito com carinho</footer>
<script>
const produtos=[
 ['Pastel',5,'Massa crocante e recheio saboroso','https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80','Mais pedido'],
 ['Fritas',20,'Porção dourada e crocante','https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=800&q=80',''],
 ['Suco lata',7,'Refrescante e gelado','https://images.unsplash.com/photo-1546173159-315724a31696?auto=format&fit=crop&w=800&q=80',''],
 ['Suco 1L',10,'Perfeito para compartilhar','https://images.unsplash.com/photo-1553530666-ba11a7da3888?auto=format&fit=crop&w=800&q=80',''],
 ['Lata 350ml',7,'Bebida gelada','https://images.unsplash.com/photo-1629203849820-fdd70d49c38e?auto=format&fit=crop&w=800&q=80',''],
 ['Lata mini',5,'Bebida gelada','https://images.unsplash.com/photo-1554866585-cd94860890b7?auto=format&fit=crop&w=800&q=80',''],
 ['Caldo de cana 300ml',8,'Fresco e preparado na hora','https://images.unsplash.com/photo-1546173159-315724a31696?auto=format&fit=crop&w=800&q=80',''],
 ['Caldo de cana 500ml',10,'Tamanho grande — opção 1','https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?auto=format&fit=crop&w=800&q=80',''],
 ['Caldo de cana 500ml',12,'Tamanho grande — opção 2','https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?auto=format&fit=crop&w=800&q=80',''],
 ['Tropeiro marmitex',20,'Refeição completa e caseira','https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=800&q=80','Mais pedido'],
 ['Tropeiro cumbuca',12,'Sabor mineiro em porção','https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80','']
];
const qtd=Array(produtos.length).fill(0), moeda=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function render(){document.getElementById('produtos').innerHTML=produtos.map((p,i)=>`<article class="produto"><div class="foto" style="background-image:url('${p[3]}')">${p[4]?`<span class="tag">${p[4]}</span>`:''}</div><div class="info"><h3>${p[0]}</h3><p class="descricao">${p[2]}</p><div class="rodape-card"><span class="preco">${moeda(p[1])}</span><div class="controle"><button onclick="alterar(${i},-1)">−</button><span class="qtd" id="q${i}">0</span><button onclick="alterar(${i},1)">+</button></div></div></div></article>`).join('')}
function alterar(i,n){qtd[i]=Math.max(0,qtd[i]+n);document.getElementById('q'+i).textContent=qtd[i];atualizar()}
function atualizar(){let itens=produtos.map((p,i)=>({...p,quantidade:qtd[i]})).filter(p=>p.quantidade);document.getElementById('lista').innerHTML=itens.length?itens.map(p=>`<li>${p[5]}x ${p[0]} — ${moeda(p[5]*p[1])}</li>`).join(''):'<li class="vazio">Seu pedido está vazio.</li>';document.getElementById('total').textContent=moeda(itens.reduce((s,p)=>s+p[5]*p[1],0))}
function limpar(){qtd.fill(0);produtos.forEach((_,i)=>document.getElementById('q'+i).textContent=0);atualizar()}render();
</script></body></html>
