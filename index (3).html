<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#651b22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Cantina do Mauro</title>
  <style>
    :root{--vinho:#651b22;--vinho2:#421116;--dourado:#d6a243;--fundo:#fbf7f0;--texto:#2c2320;--cinza:#776b63}
    *{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font-family:Arial,sans-serif;padding-bottom:90px}
    header{background:linear-gradient(135deg,var(--vinho2),var(--vinho));color:#fff;padding:25px 18px 30px;border-radius:0 0 26px 26px}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:#f9e9c7;font-size:14px}.top{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border:2px solid var(--dourado);border-radius:50%;display:grid;place-items:center;font-size:25px}
    main{padding:20px 14px;max-width:700px;margin:auto}.titulo{font-size:22px;margin:0 0 4px}.subtitulo{color:var(--cinza);font-size:14px;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border:1px solid #eadfd2;border-radius:15px;overflow:hidden;box-shadow:0 4px 14px #4b28120d}.foto{height:105px;background-size:cover;background-position:center}.info{padding:11px}.info h2{font-size:15px;margin:0 0 6px;line-height:1.2}.preco{color:var(--vinho);font-weight:bold;font-size:15px}.controle{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.controle button{width:32px;height:32px;border:0;border-radius:50%;background:var(--vinho);color:#fff;font-size:20px;line-height:1}.qtd{font-weight:bold}.resumo{margin-top:20px;background:var(--vinho2);color:#fff;border-radius:17px;padding:18px}.resumo h2{font-size:18px;margin:0 0 10px}.lista{padding-left:18px;margin:0;color:#f9e9c7;line-height:1.7;font-size:14px}.vazio{list-style:none;margin-left:-18px;color:#d7bbb0}.total{border-top:1px solid #ffffff35;margin-top:14px;padding-top:14px;display:flex;justify-content:space-between;font-weight:bold;font-size:20px}.acoes{display:flex;gap:8px;margin-top:15px}.acoes button{flex:1;border:0;border-radius:9px;padding:11px 7px;font-weight:bold;background:var(--dourado);color:#351c08}.acoes .limpar{background:#ffffff1a;color:#fff;border:1px solid #ffffff45}.instalar{position:fixed;bottom:14px;left:14px;right:14px;max-width:672px;margin:auto;background:var(--dourado);color:#351c08;border:0;border-radius:12px;padding:14px;font-weight:bold;box-shadow:0 4px 18px #0003;display:none}
    @media(max-width:360px){.grid{grid-template-columns:1fr}.foto{height:130px}}
  </style>
</head>
<body>
<header><div class="top"><div class="logo">🍽</div><div><h1>Cantina do Mauro</h1><p>Monte seu pedido com rapidez e praticidade</p></div></div></header>
<main><h2 class="titulo">Cardápio</h2><p class="subtitulo">Toque nos botões para adicionar os produtos.</p><section class="grid" id="produtos"></section><section class="resumo"><h2>Resumo do pedido</h2><ul class="lista" id="lista"><li class="vazio">Nenhum produto adicionado.</li></ul><div class="total"><span>Total</span><span id="total">R$ 0,00</span></div><div class="acoes"><button class="limpar" onclick="limpar()">Limpar</button><button onclick="window.print()">Imprimir</button></div></section></main><button class="instalar" id="instalar">Instalar aplicativo</button>
<script>
const produtos=[
 ['Pastel',5,'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=600&q=80'],['Fritas',20,'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=600&q=80'],['Suco lata',7,'https://images.unsplash.com/photo-1546173159-315724a31696?auto=format&fit=crop&w=600&q=80'],['Suco 1L',10,'https://images.unsplash.com/photo-1553530666-ba11a7da3888?auto=format&fit=crop&w=600&q=80'],['Lata 350ml',7,'https://images.unsplash.com/photo-1629203849820-fdd70d49c38e?auto=format&fit=crop&w=600&q=80'],['Lata mini',5,'https://images.unsplash.com/photo-1554866585-cd94860890b7?auto=format&fit=crop&w=600&q=80'],['Caldo de cana 300ml',8,'https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?auto=format&fit=crop&w=600&q=80'],['Caldo de cana 500ml (R$ 10)',10,'https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?auto=format&fit=crop&w=600&q=80'],['Caldo de cana 500ml (R$ 12)',12,'https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?auto=format&fit=crop&w=600&q=80'],['Tropeiro marmitex',20,'https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=600&q=80'],['Tropeiro cumbuca',12,'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=600&q=80']];
let quantidades=Array(produtos.length).fill(0);const moeda=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function montar(){document.getElementById('produtos').innerHTML=produtos.map((p,i)=>`<article class="card"><div class="foto" style="background-image:url('${p[2]}')"></div><div class="info"><h2>${p[0]}</h2><span class="preco">${moeda(p[1])}</span><div class="controle"><button onclick="alterar(${i},-1)">−</button><span class="qtd" id="q${i}">0</span><button onclick="alterar(${i},1)">+</button></div></div></article>`).join('')}
function alterar(i,n){quantidades[i]=Math.max(0,quantidades[i]+n);document.getElementById('q'+i).textContent=quantidades[i];atualizar();localStorage.setItem('cantinaPedido',JSON.stringify(quantidades))}
function atualizar(){let itens=produtos.map((p,i)=>({p,i,q:quantidades[i]})).filter(x=>x.q);document.getElementById('lista').innerHTML=itens.length?itens.map(x=>`<li>${x.q}x ${x.p[0]} — ${moeda(x.q*x.p[1])}</li>`).join(''):'<li class="vazio">Nenhum produto adicionado.</li>';document.getElementById('total').textContent=moeda(itens.reduce((s,x)=>s+x.q*x.p[1],0))}
function limpar(){quantidades.fill(0);produtos.forEach((_,i)=>document.getElementById('q'+i).textContent=0);localStorage.removeItem('cantinaPedido');atualizar()}
const salvo=JSON.parse(localStorage.getItem('cantinaPedido')||'null');if(salvo)quantidades=salvo;montar();quantidades.forEach((q,i)=>document.getElementById('q'+i).textContent=q);atualizar();
let evento;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();evento=e;document.getElementById('instalar').style.display='block'});document.getElementById('instalar').onclick=async()=>{if(evento){evento.prompt();await evento.userChoice;evento=null;document.getElementById('instalar').style.display='none'}};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
</script></body></html>
